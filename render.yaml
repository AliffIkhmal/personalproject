services:
  - type: web
    name: vehicle-service-tracking
    runtime: docker
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-service-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: vehicle-service-db
    region: singapore
    databaseName: vehicle_service_tracking
    user: vehicle_service_tracking